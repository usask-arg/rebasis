[workspace]
members = ["rebasis", "rebasis-py"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/usask-arg/rebasis"

[workspace.dependencies]
# 0.16 matches sasktran2, which will depend on the core crate.
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 2
