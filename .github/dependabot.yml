version: 2
# One grouped pull request per ecosystem and week, for releases at least a week old.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # ndarray stays on the version sasktran2 uses, so the crates can share arrays.
      - dependency-name: ndarray
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
