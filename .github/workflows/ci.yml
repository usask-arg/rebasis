name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs; Dependabot updates them. Rust caches are saved only from
# main, so a pull request cannot write a cache that main then restores.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      # rebasis-py is built as an extension module (.cargo/config.toml), which needs no Python.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p rebasis --no-deps --locked
      # As `cargo publish` does at release time: package the crate and build it from the
      # packaged files alone.
      - name: Package and test the crate on its own
        run: |
          cargo package -p rebasis --locked
          tar -xzf target/package/rebasis-*.crate -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/rebasis-*/
          cargo test --locked
      - name: Ruff (the locked version, without building the extension)
        run: |
          uv run --locked --only-group dev ruff check .
          uv run --locked --only-group dev ruff format --check .
      - name: Lint the workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rebasis-py has no Rust tests (test = false); it is tested from Python below.
      - name: Run the tests
        run: cargo test --workspace --locked

  msrv:
    name: Rust 1.85.0 (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.85.0" # overrides rust-toolchain.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the libraries
        run: cargo +1.85.0 check --workspace --lib --locked

  python:
    name: Python (${{ matrix.os }}${{ matrix.numpy && format(', numpy {0}', matrix.numpy) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        numpy: [""] # the latest
        include:
          # The oldest numpy that pyproject.toml accepts (Python 3.11 only: no 3.14 wheels).
          - os: ubuntu-latest
            numpy: "1.26.*"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # A test build: faster to compile than the release profile (fat LTO, one codegen unit).
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      NUMPY: ${{ matrix.numpy }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the abi3 wheel once
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test it with Python 3.11
        run: |
          python -m pip install --only-binary :all: "$(ls dist/*.whl)[test]" \
            ${NUMPY:+"numpy==$NUMPY"} ${NUMPY:+"scipy<1.15"}
          python -m pytest -q
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !matrix.numpy }}
        with:
          python-version: "3.14"
      - name: Test it with Python 3.14
        if: ${{ !matrix.numpy }}
        run: |
          python -m pip install --only-binary :all: "$(ls dist/*.whl)[test]"
          python -m pytest -q

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
      # -E rereads every source, -W makes every warning an error; the pages are executed.
      - name: Build the documentation
        run: uv run --locked --extra docs sphinx-build -E -W --keep-going -b html docs docs/_build/html

  # The one status check to require in branch protection.
  all-checks:
    name: All checks passed
    if: always()
    needs: [lint, rust-test, msrv, python, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
