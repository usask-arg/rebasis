# Adapted from scat-rs's release workflow, itself generated from maturin's GitHub Actions
# template: wheels and the sdist are built on every push to main, on pull requests that touch
# the packaging, and on tags; the wheels are then installed and tested. A tag vX.Y.Z publishes
# them to PyPI as `pyrebasis`, then the rebasis crate to crates.io (Trusted Publishing for both, from the
# environments `pypi` and `crates-io`), once the preflight checks pass. The extension is
# abi3-py311, so one wheel per platform, built with Python 3.11, serves every later Python.
#
# Actions are pinned to commit SHAs (Dependabot updates them); no caches, so that nothing a
# pull request wrote can reach a release build.
name: Build Python distributions

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - rust-toolchain.toml
      - ".cargo/**"
      - rebasis/Cargo.toml
      - "rebasis-py/**"
      - "python/**"
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests cancel superseded runs; a tag's publishing run always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the ancestry check against origin/main
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Check that the tag is v<Cargo version>, on a commit of main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "rebasis") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo version (v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi
      - name: Package and verify the crate as crates.io will
        run: cargo publish -p rebasis --locked --dry-run

  linux:
    name: Wheel (manylinux ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0" # as in uv.lock
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    name: Wheel (musllinux ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0" # as in uv.lock
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    name: Wheel (Windows ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_architecture: x64
          - runner: windows-11-arm
            target: aarch64
            python_architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.platform.python_architecture }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0" # as in uv.lock
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    name: Wheel (macOS ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0" # as in uv.lock
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0" # as in uv.lock
          command: sdist
          args: --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # The built wheels, installed from the artifact (never from source) and tested, on every
  # platform a GitHub runner exists for; the others are built but not tested.
  test-wheels:
    name: Test ${{ matrix.platform.artifact }} (Python ${{ matrix.python-version }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        platform:
          - runner: ubuntu-latest
            artifact: wheels-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
          - runner: windows-latest
            artifact: wheels-windows-x64
            python_architecture: x64
          - runner: windows-11-arm
            artifact: wheels-windows-aarch64
            python_architecture: arm64
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64
          - runner: macos-latest
            artifact: wheels-macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.python_architecture }}
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      - name: Install it, with binary dependencies only
        run: |
          wheel=$(ls dist/*.whl)
          python -m pip install --only-binary :all: "${wheel}[test]"
      - name: Run the tests
        run: python -m pytest -q

  # Users without a matching wheel build from the sdist: check that it builds and works.
  test-sdist:
    name: Test the sdist (built from source)
    needs: [sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A test build: faster to compile than the release profile (fat LTO, one codegen unit).
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-sdist
          path: dist
      - name: Build and install it
        run: python -m pip install "$(ls dist/*.tar.gz)[test]"
      - name: Run the tests
        run: python -m pytest -q

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, linux, musllinux, windows, macos, sdist, test-wheels, test-sdist]
    environment:
      name: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true # a re-run after a failed crates.io step publishes nothing twice

  crates-io:
    name: Publish rebasis crate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish]
    environment:
      name: crates-io
    permissions:
      contents: read # checkout
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p rebasis --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
